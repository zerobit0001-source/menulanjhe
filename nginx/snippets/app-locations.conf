# Shared by http.conf.template and https.conf.template.
#
#   /ws/          -> Daphne (Django Channels, realtime orders)
#   /media/       -> uploaded images (shared volume)
#   /static/      -> Django static files (admin CSS/JS)
#   /admin/       -> Django admin
#   /api/health/  -> Django health check
#   everything else, including /api/v1/*  -> Next.js
#   (Next.js route handlers proxy /api/v1/* to Django internally)

location /ws/ {
    proxy_pass http://ws_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /media/ {
    alias /var/www/media/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location /static/ {
    alias /var/www/static/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

location /admin/ {
    proxy_pass http://django_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_read_timeout 60s;
}

location = /api/health/ {
    proxy_pass http://django_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
    access_log off;
}

location /_next/static/ {
    proxy_pass http://next_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location / {
    proxy_pass http://next_upstream;
    include /etc/nginx/snippets/proxy-common.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
}
