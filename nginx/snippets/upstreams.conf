upstream django_upstream { server web:8000; keepalive 16; }
upstream ws_upstream     { server ws:8001; }
upstream next_upstream   { server frontend:3000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

client_max_body_size 10m;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;
