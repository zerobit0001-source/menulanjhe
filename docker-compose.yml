name: menulanjhe

# All settings live in ./.env (copy .env.example). See DEPLOY.md.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  ALLOWED_HOSTS: ${DOMAIN:?DOMAIN must be set in .env}
  CSRF_TRUSTED_ORIGINS: ${PUBLIC_URL:?PUBLIC_URL must be set in .env}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
  PUBLIC_TABLE_URL_BASE: ${PUBLIC_URL}/menu
  MEDIA_URL: ${PUBLIC_URL}/media/
  DATABASE_URL: postgres://${POSTGRES_USER:-menu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-menu}
  REDIS_URL: redis://redis:6379
  NUM_PROXIES: "1"
  USE_HTTPS: ${USE_HTTPS:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-menu}
      POSTGRES_USER: ${POSTGRES_USER:-menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Django REST API (gunicorn). Runs migrations + collectstatic on start.
  web:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: menulanjhe-backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  # Django Channels (Daphne) for realtime orders over WebSocket.
  ws:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: menulanjhe-backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--proxy-headers", "config.asgi:application"]
    depends_on:
      web: {condition: service_healthy}

  # Next.js 16 (standalone server). Its /api/v1/* route handlers call Django
  # over the internal network.
  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
    image: menulanjhe-frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://web:8000/api/v1
      COOKIE_SECURE: ${USE_HTTPS:-true}
    depends_on:
      web: {condition: service_healthy}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/${NGINX_MODE:-http}.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    depends_on:
      web: {condition: service_healthy}
      frontend: {condition: service_healthy}
      ws: {condition: service_started}

  # Only used on demand: docker compose --profile certbot run --rm certbot ...
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

volumes:
  pgdata:
  redisdata:
  media:
  static:
